{include file='public/header.html'}

<div class="bg-primary text-white py-5">
    <div class="container text-center">
        <h1 class="display-5 fw-bold">{:site('site_h1', 'XPHP')}</h1>
        <p class="lead mb-4">{:site('site_h2', '一个简单易用的轻量级php框架')}</p>
        <a class="btn btn-light me-2" href="{:url('user/login')}"><i class="mdi mdi-login me-1"></i>用户登录</a>
        <a class="btn btn-outline-light me-2" href="__HOST__/admin.php"><i class="mdi mdi-cog me-1"></i>进入后台</a>
        <a class="btn btn-outline-light" href="https://xphp.net/docs" target="_blank"><i class="mdi mdi-book-open me-1"></i>开发文档</a>
    </div>
</div>

<div class="container py-4">
    <div class="alert alert-warning d-flex align-items-center">
        <i class="mdi mdi-bullhorn me-2 fs-5"></i>
        <div><strong>公告：</strong><span class="text-danger">{site('site_notice') ?: '暂无公告！'}</span></div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body py-4">
                    <i class="mdi mdi-rocket-launch fs-1 text-primary"></i>
                    <h5 class="card-title mt-2">快速开始</h5>
                    <p class="card-text text-muted">配置调用：<code>{:site('键名')}</code></p>
                    <p class="card-text text-muted">快速CRUD：通过后台菜单 <code>生成</code> 进行</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body py-4">
                    <i class="mdi mdi-view-dashboard fs-1 text-success"></i>
                    <h5 class="card-title mt-2">开发案例</h5>
                    <p class="card-text"><a href="https://xphp.net" target="_blank">框架官网</a></p>
                    <p class="card-text"><a href="https://aphp.top" target="_blank">一鱼博客</a></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body py-4">
                    <i class="mdi mdi-account-group fs-1 text-info"></i>
                    <h5 class="card-title mt-2">用户模块</h5>
                    <p class="card-text text-muted">登录、注册、修改资料</p>
                    <p class="card-text"><a href="{:url('user/info',['id'=>1])}">查看用户</a></p>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted small">
        <a href="javascript:ajaxConfirm('{:url('api/clear')}','清除缓存');">清除缓存</a>
    </div>
</div>

{include file='public/footer.html'}
