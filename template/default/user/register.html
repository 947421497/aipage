{include file='public/header.html'}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="mdi mdi-account-plus me-2"></i>用户注册</h5>
                </div>
                <div class="card-body">
                    <form class="site-form submit-ajax" action="{:url('user/register')}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label"><span class="text-danger">*</span> 用户名</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="nickname" class="form-label"><span class="text-danger">*</span> 昵称</label>
                                <input type="text" id="nickname" name="nickname" class="form-control" placeholder="请输入昵称" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label"><span class="text-danger">*</span> 登录密码</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="re_password" class="form-label"><span class="text-danger">*</span> 确认密码</label>
                                <input type="password" id="re_password" name="re_password" class="form-control" placeholder="请确认密码" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="qq" class="form-label">QQ</label>
                                <input type="text" id="qq" name="qq" class="form-control" placeholder="请输入QQ" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">邮箱</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="请输入邮箱" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mobile" class="form-label">手机</label>
                                <input type="text" id="mobile" name="mobile" class="form-control" placeholder="请输入手机号" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bio" class="form-label">格言</label>
                                <input type="text" id="bio" name="bio" class="form-control" placeholder="请输入格言" />
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary"><i class="mdi mdi-account-plus me-1"></i>注册</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-white text-center">
                    <span class="text-muted">已有账号？</span>
                    <a href="{:url('user/login')}">去登录</a>
                </div>
            </div>
        </div>
    </div>
</div>

{include file='public/footer.html'}
