{include file='public/header.html'}

<div class="container mtn">
	{include file='user/_top_nav.html'}
	<div class="panel panel-default mtn">
		<div class="panel-heading">
			个人中心<span class="pull-right"><a href="javascript:history.back(-1);">返回</a></span>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="col-md-3">
					<div style="text-align:center;margin-top:5px;">
						<img src="{:get_avatar($vo['avatar'], $vo['qq'])}" width="80" height="80" class="img-circle" alt="avatar"/>
						<p style="margin-top:15px;"><strong>{$vo.nickname}</strong> v{$vo.level}</p>
					</div>
				</div>
				<div class="col-md-9">
					<div class="form-horizontal user-profile">
						<div class="form-group">
							<label class="col-sm-2 control-label">格言</label>
							<div class="col-sm-10">
								<p class="form-control-static">{$vo.bio|default='暂无'}</p>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label">QQ</label>
							<div class="col-sm-10">
								<p class="form-control-static">{$vo.qq|default='暂无'}</p>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label">邮箱</label>
							<div class="col-sm-10">
								<p class="form-control-static">{$vo.email|default='暂无'}</p>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label">手机</label>
							<div class="col-sm-10">
								<p class="form-control-static">{$vo.mobile|default='暂无'}</p>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label">注册时间</label>
							<div class="col-sm-10">
								<p class="form-control-static">{$vo.create_time|date='Y-m-d H:i:s'}</p>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</div>

{include file='public/footer.html'}
</body>
</html>
