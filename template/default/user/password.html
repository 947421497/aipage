{include file='public/header.html'}

<div class="container py-4 pb-lg-0 pb-5">
    <div class="row g-4">
        <!-- 左侧导航 -->
        <div class="col-lg-3 d-none d-lg-block">
            <div class="card border-0 shadow-sm position-sticky" style="top:72px;">
                <div class="card-body text-center py-4 border-bottom">
                    <img src="{:get_avatar(session('user.avatar'), session('user.qq'))}" class="rounded-circle mb-2" width="56" height="56" alt="avatar" />
                    <h6 class="mb-1">{:session('user.nickname')}</h6>
                    <p class="text-muted small mb-0">修改账户密码</p>
                </div>
                <nav class="list-group list-group-flush py-2">
                    <a href="{:url('user/index')}" class="list-group-item list-group-item-action border-0 rounded-0 px-3 py-2">
                        <i class="mdi mdi-account-box me-2"></i>个人中心
                    </a>
                    <a href="{:url('user/profile')}" class="list-group-item list-group-item-action border-0 rounded-0 px-3 py-2">
                        <i class="mdi mdi-pencil me-2"></i>修改资料
                    </a>
                    <a href="{:url('user/password')}" class="list-group-item list-group-item-action border-0 rounded-0 px-3 py-2 active">
                        <i class="mdi mdi-lock me-2"></i>修改密码
                    </a>
                </nav>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0"><i class="mdi mdi-lock me-2 text-warning"></i>修改密码</h5>
                </div>
                <div class="card-body p-4">
                    <div class="d-lg-none d-flex align-items-center gap-3 mb-4 p-3 bg-light rounded">
                        <img src="{:get_avatar(session('user.avatar'), session('user.qq'))}" class="rounded-circle" width="48" height="48" alt="avatar" />
                        <div>
                            <h6 class="mb-0">{:session('user.nickname')}</h6>
                            <small class="text-muted">修改账户密码</small>
                        </div>
                    </div>
                    <form class="site-form submit-ajax" action="{:url('user/password')}" method="post">
                        <div class="row g-3" style="max-width:480px;">
                            <div class="col-12">
                                <label for="old_pwd" class="form-label"><span class="text-danger">*</span> 旧密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="mdi mdi-lock-outline"></i></span>
                                    <input type="password" id="old_pwd" name="old_pwd" class="form-control" placeholder="请输入旧密码" />
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="new_pwd" class="form-label"><span class="text-danger">*</span> 新密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="mdi mdi-lock-plus-outline"></i></span>
                                    <input type="password" id="new_pwd" name="new_pwd" class="form-control" placeholder="请输入新密码" />
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="re_pwd" class="form-label"><span class="text-danger">*</span> 确认密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="mdi mdi-lock-check-outline"></i></span>
                                    <input type="password" id="re_pwd" name="re_pwd" class="form-control" placeholder="请确认新密码" />
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary px-4"><i class="mdi mdi-check me-1"></i>修改密码</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 移动端底部导航 -->
<nav class="d-lg-none fixed-bottom bg-white border-top py-2" style="z-index:1040;">
    <div class="d-flex justify-content-around">
        <a href="{:url('user/index')}" class="text-muted text-center text-decoration-none px-3">
            <i class="mdi mdi-account-box d-block fs-5"></i>
            <small>个人中心</small>
        </a>
        <a href="{:url('user/profile')}" class="text-muted text-center text-decoration-none px-3">
            <i class="mdi mdi-pencil d-block fs-5"></i>
            <small>修改资料</small>
        </a>
        <a href="{:url('user/password')}" class="text-primary text-center text-decoration-none px-3">
            <i class="mdi mdi-lock d-block fs-5"></i>
            <small>修改密码</small>
        </a>
    </div>
</nav>

{include file='public/footer.html'}
