{include file='public/header.html'}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="mdi mdi-login me-2"></i>用户登录</h5>
                </div>
                <div class="card-body" style="max-width:460px;margin:0 auto;">
                    <form class="site-form submit-ajax" action="" method="post">
                        <input type="hidden" name="referer" value="__HISTORY__">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="mdi mdi-account"></i></span>
                                <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" value="{:input('get.from','','clear_html')}" />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="mdi mdi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="captcha" class="form-label">验证码</label>
                            <div class="input-group">
                                <input type="text" id="captcha" name="captcha" class="form-control" placeholder="请输入验证码" />
                                <img src="{:url('user/captcha')}" class="input-group-text" style="cursor:pointer;padding:0;border-radius:0 4px 4px 0;" onclick="this.src='{:url('user/captcha')}?'+Math.random();" alt="验证码" />
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary"><i class="mdi mdi-login me-1"></i>登录</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-white text-center">
                    <span class="text-muted">还没有账号？</span>
                    <a href="{:url('user/register')}">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>

{include file='public/footer.html'}
