<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{if $status==1:}操作成功{else:}操作失败{/if}</title>
<link rel="stylesheet" href="__STATIC__/css/bootstrap.min.css">
<link rel="stylesheet" href="__STATIC__/css/materialdesignicons.min.css">
<link rel="stylesheet" href="__STATIC__/css/animate.min.css">
<link rel="stylesheet" href="__STATIC__/css/style.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body py-5">
                    {if $status==1:}
                    <i class="mdi mdi-check-circle text-success" style="font-size:80px;"></i>
                    <h4 class="mt-3 mb-2 text-success">{$msg}</h4>
                    <p class="text-muted mb-3">
                        <span id="wait" class="fw-bold">5</span> 秒后自动跳转
                    </p>
                    <a id="href" href="{$url}" class="btn btn-primary me-2"><i class="mdi mdi-check me-1"></i>确认</a>
                    {else:}
                    <i class="mdi mdi-close-circle text-danger" style="font-size:80px;"></i>
                    <h4 class="mt-3 mb-2 text-danger">{$msg}</h4>
                    <a href="{$url}" class="btn btn-primary me-2"><i class="mdi mdi-check me-1"></i>确认</a>
                    {/if}
                    <a href="{:url('index/index')}" class="btn btn-outline-secondary"><i class="mdi mdi-home me-1"></i>返回首页</a>
                </div>
            </div>
        </div>
    </div>
</div>
{if $status==1:}
<script>
(function(){
    var wait = document.getElementById('wait');
    var href = document.getElementById('href').href;
    var interval = setInterval(function(){
        var time = --wait.innerHTML;
        if (time <= 0) {
            clearInterval(interval);
            location.href = href;
        }
    }, 1000);
})();
</script>
{/if}
<script src="__STATIC__/js/jquery.min.js"></script>
<script src="__STATIC__/js/bootstrap.min.js"></script>
</body>
</html>
