<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
<title>登录 - {:site('site_title')}</title>
<link rel="shortcut icon" type="image/x-icon" href="__STATIC__/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" type="text/css" href="__STATIC__/css/materialdesignicons.min.css">
<link rel="stylesheet" type="text/css" href="__STATIC__/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="__STATIC__/css/animate.min.css">
<link rel="stylesheet" type="text/css" href="__STATIC__/css/style.min.css">
</head>
<body class="bg-white overflow-x-hidden">
<div class="row bg-white vh-100">
  <div class="col-md-6 col-lg-7 col-xl-8 d-none d-md-block" style="background-image: url(__STATIC__/images/login-bg-1.jpg); background-size: cover;">
    <div class="d-flex vh-100">
      <div class="p-5 align-self-end">
        <img src="__STATIC__/images/logo.png" alt="{:site('site_name','后台管理')}">
        <br><br><br>
        <p class="text-white">{:site('site_description','后台管理系统')}</p>
      </div>
    </div>
  </div>
  <div class="col-md-6 col-lg-5 col-xl-4 align-self-center">
    <div class="p-5">
      <div class="text-center">
        <a href="{:url('index/index')}"><img alt="{:site('site_name','后台管理')}" src="__STATIC__/images/logo-sidebar.png"></a>
      </div>
      <p class="text-center text-muted"><small>请使用您的账号登录系统</small></p>
      <form action="{:url('login')}" method="post" class="signin-form needs-validation" novalidate>
        <div class="mb-3">
          <label for="username">用户名</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="请输入您的用户名" value="{:input('get.from')}" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password">密码</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="请输入您的密码" required>
        </div>
        <div class="mb-3">
          <div class="row">
            <div class="col-6">
              <input type="text" name="captcha" class="form-control" id="captcha" placeholder="验证码" required>
            </div>
            <div class="col-6">
              <img src="{:url('captcha')}" style="cursor:pointer; height:38px;" onclick="this.src='{:url('captcha')}?'+Math.random();" alt="captcha"/>
            </div>
          </div>
        </div>
        <div class="mb-3 d-grid">
          <button class="btn btn-primary" type="submit">立即登录</button>
        </div>
      </form>
      <p class="text-center text-muted mt-3"><a href="__ROOT__/index.php">返回首页</a></p>
    </div>
  </div>
</div>
<script type="text/javascript" src="__STATIC__/js/jquery.min.js"></script>
<script type="text/javascript" src="__STATIC__/js/popper.min.js"></script>
<script type="text/javascript" src="__STATIC__/js/bootstrap.min.js"></script>
<script type="text/javascript" src="__STATIC__/js/lyear-loading.js"></script>
<script type="text/javascript" src="__STATIC__/js/bootstrap-notify.min.js"></script>
<script type="text/javascript" src="__STATIC__/js/xphp-1.0.js?v={:site_ver()}"></script>
<script type="text/javascript">
var loader;
$(document).ajaxStart(function(){
    $("button:submit").html('登录中...').attr("disabled", true);
    loader = $('button:submit').lyearloading({
        opacity: 0.2,
        spinnerSize: 'nm'
    });
}).ajaxStop(function(){
    loader.destroy();
    $("button:submit").html('立即登录').attr("disabled", false);
});
$('.signin-form').on('submit', function(event) {
    if ($(this)[0].checkValidity() === false) {
        event.preventDefault();
        event.stopPropagation();
        $(this).addClass('was-validated');
        return false;
    }
    var $data = $(this).serialize();
    $.post($(this).attr('action'), $data, function(res) {
        if (res.code) {
            $.notify({
                message: '登录成功，页面即将跳转~',
            },{
                type: 'success',
                placement: { from: 'top', align: 'right' },
                z_index: 10800,
                delay: 1500,
                animate: {
                    enter: 'animate__animated animate__fadeInUp',
                    exit: 'animate__animated animate__fadeOutDown'
                }
            });
            setTimeout(function () {
                location.href = res.url || '{:url("index/index")}';
            }, 1500);
        } else {
            $.notify({
                message: '登录失败，错误原因：' + res.msg,
            },{
                type: 'danger',
                placement: { from: 'top', align: 'right' },
                z_index: 10800,
                delay: 1500,
                animate: {
                    enter: 'animate__animated animate__shakeX',
                    exit: 'animate__animated animate__fadeOutDown'
                }
            });
            $('#password').val('');
            $("#captcha").click();
        }
    }).fail(function () {
        $.notify({
            message: '服务器错误',
        },{
            type: 'danger',
            placement: { from: 'top', align: 'right' },
            z_index: 10800,
            delay: 1500,
            animate: {
                enter: 'animate__animated animate__shakeX',
                exit: 'animate__animated animate__fadeOutDown'
            }
        });
    });
    return false;
});
</script>
</body>
</html>
