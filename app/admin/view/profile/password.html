{include file='public/_head.html'}
</head>
<body>
<div id="lyear-preloader" class="loading">
  <div class="ctn-preloader">
    <div class="round_spinner">
      <div class="spinner"></div>
      <img src="__STATIC__/images/loading-logo.png" alt="">
    </div>
  </div>
</div>
<div class="lyear-layout-web">
  <div class="lyear-layout-container">
    {include file='public/sidebar.html'}
    {include file='public/_header.html'}

    <main class="lyear-layout-content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-12">
            <div class="card">
              <header class="card-header"><div class="card-title">修改密码</div></header>
              <div class="card-body">
                <form class="site-form submit-ajax" action="{:url('password')}" method="post">
                  <div class="mb-3">
                    <label for="old_pwd" class="form-label">*旧密码</label>
                    <input type="password" id="old_pwd" name="old_pwd" class="form-control" placeholder="请输入旧密码">
                  </div>
                  <div class="mb-3">
                    <label for="new_pwd" class="form-label">*新密码</label>
                    <input type="password" id="new_pwd" name="new_pwd" class="form-control" placeholder="请输入新密码">
                  </div>
                  <div class="mb-3">
                    <label for="re_pwd" class="form-label">*确认密码</label>
                    <input type="password" id="re_pwd" name="re_pwd" class="form-control" placeholder="请确认新密码">
                  </div>
                  <button type="submit" class="btn btn-primary">修改密码</button>
                  <button type="button" class="btn btn-default" onclick="javascript:history.back(-1);return false;">返回</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    {include file='public/footer.html'}
</body>
</html>
