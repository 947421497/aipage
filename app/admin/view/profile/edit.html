{include file='public/_head.html'}
</head>
<body>
<div id="lyear-preloader" class="loading">
  <div class="ctn-preloader">
    <div class="round_spinner">
      <div class="spinner"></div>
      <img src="__STATIC__/images/loading-logo.png" alt="">
    </div>
  </div>
</div>
<div class="lyear-layout-web">
  <div class="lyear-layout-container">
    {include file='public/sidebar.html'}
    {include file='public/_header.html'}

    <main class="lyear-layout-content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-12">
            <div class="card">
              <header class="card-header"><div class="card-title">修改资料</div></header>
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <img src="{:get_avatar($vo['avatar'], $vo['qq'])}" class="rounded-circle me-3" width="80" height="80" alt="avatar">
                  <div class="flex-grow-1">
                    <h5 class="mb-1">{$vo.nickname} <small class="text-muted">v{$vo.level}</small></h5>
                    <a href="{:url('profile/edit')}" class="btn btn-sm btn-outline-primary">修改头像</a>
                    <small class="text-muted ms-2">支持 JPG、PNG 格式</small>
                  </div>
                </div>
                <hr>
                <form class="site-form submit-ajax" action="{:url('profile/edit')}" method="post">
                  <input type="hidden" name="id" value="{$vo.id}">
                  <div class="mb-3">
                    <label for="nickname" class="form-label">*昵称</label>
                    <input type="text" id="nickname" name="nickname" class="form-control" placeholder="请输入昵称" value="{$vo.nickname}">
                  </div>
                  <div class="mb-3">
                    <label for="bio" class="form-label">格言</label>
                    <input type="text" id="bio" name="bio" class="form-control" placeholder="请输入格言" value="{$vo.bio}">
                  </div>
                  <div class="mb-3">
                    <label for="qq" class="form-label">QQ</label>
                    <input type="text" id="qq" name="qq" class="form-control" placeholder="请输入QQ号" value="{$vo.qq}">
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="请输入邮箱" value="{$vo.email}">
                  </div>
                  <div class="mb-3">
                    <label for="mobile" class="form-label">手机</label>
                    <input type="text" id="mobile" name="mobile" class="form-control" placeholder="请输入手机号" value="{$vo.mobile}">
                  </div>
                  <button type="submit" class="btn btn-primary">保存</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    {include file='public/footer.html'}
</body>
</html>
