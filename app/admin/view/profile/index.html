{include file='public/_head.html'}
</head>
<body>
<div id="lyear-preloader" class="loading">
  <div class="ctn-preloader">
    <div class="round_spinner">
      <div class="spinner"></div>
      <img src="__STATIC__/images/loading-logo.png" alt="">
    </div>
  </div>
</div>
<div class="lyear-layout-web">
  <div class="lyear-layout-container">
    {include file='public/sidebar.html'}
    {include file='public/_header.html'}

    <main class="lyear-layout-content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-12">
            <div class="card">
              <header class="card-header"><div class="card-title">个人中心</div></header>
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <img src="{:get_avatar($vo['avatar'], $vo['qq'])}" class="rounded-circle me-3" width="80" height="80" alt="avatar">
                  <div class="flex-grow-1">
                    <h5 class="mb-1">{$vo.nickname} <small class="text-muted">v{$vo.level}</small></h5>
                    <a href="javascript:openModal('{:url('profile/edit')}','修改资料')" class="btn btn-sm btn-outline-primary">修改资料</a>
                    <small class="text-muted ms-2">支持 JPG、PNG 格式</small>
                  </div>
                </div>
                <hr>
                <form class="site-form">
                  <div class="mb-3">
                    <label>格言</label>
                    <input type="text" class="form-control-plaintext" readonly value="{$vo.bio|default='暂无'}">
                  </div>
                  <div class="mb-3">
                    <label>QQ</label>
                    <input type="text" class="form-control-plaintext" readonly value="{$vo.qq|default='暂无'}">
                  </div>
                  <div class="mb-3">
                    <label>邮箱</label>
                    <input type="text" class="form-control-plaintext" readonly value="{$vo.email|default='暂无'}">
                  </div>
                  <div class="mb-3">
                    <label>手机</label>
                    <input type="text" class="form-control-plaintext" readonly value="{$vo.mobile|default='暂无'}">
                  </div>
                  <div class="mb-3">
                    <label>注册时间</label>
                    <input type="text" class="form-control-plaintext" readonly value="{$vo.create_time|date='Y-m-d H:i:s'}">
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    {include file='public/footer.html'}
</body>
</html>
