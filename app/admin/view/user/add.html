{include file='public/_head.html'}
</head>
<body>
<div id="lyear-preloader" class="loading">
  <div class="ctn-preloader">
    <div class="round_spinner">
      <div class="spinner"></div>
      <img src="__STATIC__/images/loading-logo.png" alt="">
    </div>
  </div>
</div>
<div class="lyear-layout-web">
  <div class="lyear-layout-container">
    {include file='public/sidebar.html'}
    {include file='public/_header.html'}

    <main class="lyear-layout-content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-12">
            <div class="card">
              <header class="card-header"><div class="card-title">添加用户</div></header>
              <div class="card-body">
                <form class="site-form submit-ajax" action="{:url('add')}" method="post">
                  <div class="mb-3">
                    <label class="form-label" for="username">*用户名</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="nickname">*昵称</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="password">*登录密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="re_password">*确认密码</label>
                    <input type="password" class="form-control" id="re_password" name="re_password" placeholder="请确认密码" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="bio">格言</label>
                    <input type="text" class="form-control" id="bio" name="bio" placeholder="请输入格言" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="qq">QQ</label>
                    <input type="text" class="form-control" id="qq" name="qq" placeholder="请输入QQ" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="email">邮箱</label>
                    <input type="text" class="form-control" id="email" name="email" placeholder="请输入邮箱" value="" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="mobile">手机</label>
                    <input type="text" class="form-control" id="mobile" name="mobile" placeholder="请输入手机号" value="" />
                  </div>
                  <div class="mb-3">
                    <button type="submit" class="btn btn-primary">确定</button>
                    <button type="button" class="btn btn-default" onclick="javascript:history.back(-1);return false;">返回</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    {include file='public/footer.html'}
</body>
</html>
