<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#222;min-height:100vh;display:flex;flex-direction:column;}
        a {color:#3b82f6;text-decoration:none;}
        .error-container {max-width:500px;width:90%;margin:120px auto 60px;text-align:center;}
        .error-code {font-size:5rem;font-weight:800;color:#ef4444;margin-bottom:10px;line-height:1;}
        .error-title {font-size:1.5rem;font-weight:600;color:#1f2937;margin-bottom:15px;}
        .error-message {color:#6b7280;font-size:1rem;margin-bottom:30px;line-height:1.5;}
        .action-buttons {display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px;}
        .btn {display:inline-block;text-decoration:none;font-weight:500;font-size:0.9rem;padding:8px 20px;border-radius:6px;transition:all 0.2s;}
        .btn-primary {background:#2563eb;color:white;}
        .btn-primary:hover {background:#3b82f6;}
        .btn-secondary {background:#f1f5f9;color:#4b5563;border:1px solid #e5e7eb;}
        .btn-secondary:hover {background:#e5e7eb;}
        .footer {padding:20px;margin-top:auto;border-top:1px solid #e5e7eb;}
        .footer-inner {max-width:500px;margin:0 auto;}
        .copyright {text-align:right;color:#9ca3af;font-size:0.9rem;}
        @media (max-width:640px) {
            .error-container {margin:60px auto 40px;}
            .error-code {font-size:4rem;}
            .error-title {font-size:1.3rem;}
            .action-buttons {gap:10px;}
            .btn {font-size:0.85rem;padding:7px 16px;}
            .copyright {text-align:center;}
        }
        @media (max-width:480px) {
            .action-buttons {flex-direction:column;align-items:center;}
            .btn {width:70%;text-align:center;}
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-message">
        {$msg}
    </p>
    <div class="action-buttons">
        <a href="{:url('index/index')}" class="btn btn-primary">返回首页</a>
        <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
    </div>
</div>
<footer class="footer">
    <div class="footer-inner">
        <div class="copyright">
            <a href="https://xphp.net" target="_blank">XPHP</a> © {:date('Y')} • 轻量设计 • 高效开发
        </div>
    </div>
</footer>
</body>
</html>
